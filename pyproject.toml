[project]
name = "a2"
version = "0.1.0"
description = "CSE 158/258 Assignment 2 - group project"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "gensim",
    "python-dateutil",
    "ipykernel",
    "nbconvert",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
